<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EMS | Sign up</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-panel"><div class="auth-mark">E</div><p class="eyebrow">Employee Management System</p><h1>Create account</h1><p class="muted">New accounts are created with HR access.</p><div id="signup-feedback" class="feedback" hidden></div><form id="signup-form" novalidate><label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="80" placeholder="your.name"></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Repeat your password"></label><button class="button primary" type="submit">Create account</button></form><p class="auth-hint"><a href="login.html">Already have an account? Sign in</a></p></section></main><style>.auth-page{min-height:100vh;display:grid;place-items:center;background:#f5f6fb}.auth-shell{width:min(440px,calc(100% - 32px))}.auth-panel{background:#fff;border:1px solid #e5e7ef;border-radius:12px;padding:36px;box-shadow:0 18px 50px rgba(29,38,68,.1)}.auth-mark{display:grid;place-items:center;width:42px;height:42px;margin-bottom:22px;background:#4b57d9;color:#fff;border-radius:10px;font:700 22px 'Space Grotesk',sans-serif}.auth-panel h1{margin:0 0 8px;font:700 30px 'Space Grotesk',sans-serif}.auth-panel form{display:grid;gap:16px;margin-top:26px}.auth-panel label{display:grid;gap:7px}.auth-panel input{width:100%}.auth-panel button{width:100%}.auth-hint{color:#8b92a0;font-size:11px;margin:20px 0 0;line-height:1.5}.auth-hint a{color:#4b57d9;font-weight:700;text-decoration:none}</style><script src="js/auth.js"></script></body></html>
